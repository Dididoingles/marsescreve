<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página não encontrada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&family=Shantell+Sans:wght@300;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            width: 100vw;
            background-color: #fff8f8;
            font-family: 'Poppins', sans-serif;
            color: #352f2d;
            line-height: 1.2;
            letter-spacing: -1px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-x: hidden;
        }

        /* Desktop Layout: Left and Right columns */
        .container {
            display: flex;
            align-items: center;
            justify-content: left;
            margin-left: -200px;
            gap: 10px; /* Space between left and right side */
            max-width: 1100px;
            width: 100%;
        }

        /* Left Side (Image & 404) */
        .left-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .lost-image {
            width: 220px;
            height: auto;
            margin-bottom: 10px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.1));
        }

        h1 {
            font-family: 'Shantell Sans', 'Poppins', sans-serif;
            font-size: 8rem; /* Huge on desktop */
            font-weight: 700;
            color: #c20000;
            line-height: 1;
            letter-spacing: -4px;
            text-shadow: 6px 6px 0 rgba(194, 0, 0, 0.15);
        }

        /* Right Side (Text & Button) */
        .right-side {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            flex: 1;
            max-width: 550px;
        }

        h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #352f2d;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        p {
            font-size: 1.1rem;
            font-weight: 300;
            color: #9b9898;
            line-height: 1.5;
            margin-bottom: 10px;
            text-wrap: pretty;
        }

        /* Your exact Button */
        .start-btn {
            display: inline-block;
            background-color: #c4251f;
            color: #ffffff;
            font-family: 'Shantell Sans', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 10px;
            border: 2px solid #222222;
            margin-top: 30px;
            transition: transform 0.2s, background 0.2s;
            letter-spacing: 0px;
            box-shadow: 2px 3px 0 rgba(34,34,34,0.85);
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
            cursor: pointer;
        }

        .start-btn:hover {
            background-color: #c00000;
            transform: translateY(2px) translateX(2px);
            box-shadow: 1px 2px 0 rgba(34,34,34,0.85);
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }

        .fade-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*  Tablet & Mobile Adjustments */
        @media (max-width: 850px) {
            body {
                padding: 30px 20px;
            }
            .container {
                flex-direction: column; /* Stack vertically */
                gap: 30px;
                text-align: center;
                margin-left: 0px;
            }
            .left-side, .right-side {
                align-items: center;
                flex: none;
                width: 100%;
            }
            .lost-image {
                width: 160px;
                margin-bottom: 0;
            }
            h1 {
                font-size: 6rem;
                text-shadow: 4px 4px 0 rgba(194, 0, 0, 0.15);
            }
            h2 {
                font-size: 1.8rem;
                margin-bottom: 15px;
            }
            p {
                font-size: 1rem;
                max-width: 90%;
                margin: 0 auto 10px auto;
            }
            .start-btn {
                width: 100%;
                text-align: center;
                margin-top: 20px;
            }
        }

        @media (max-width: 480px) {
            h1 { font-size: 4.5rem; }
            h2 { font-size: 1.5rem; }
            .lost-image { width: 130px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Left Side: Image & 404 -->
        <div class="left-side">
            <img src="../assets/marsicon.png" alt="Mars lost" class="lost-image fade-up delay-1">
            <h1 class="fade-up delay-2">404</h1>
        </div>

        <!-- Right Side: Message & Button -->
        <div class="right-side">
            <h2 class="fade-up delay-2">O Mars se perdeu!</h2>
            
            <p class="fade-up delay-3">
                Parece que a página que você está procurando não existe ou foi movida para outro lugar do universo. 
                Não se preocupe, podemos voltar para a nossa estação de trabalho.
            </p>

            <a href="../" class="start-btn fade-up delay-4">Voltar para casa</a>
        </div>

    </div>

</body>
</html>
